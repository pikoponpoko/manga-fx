name: Release

on:
  push:
    branches: [main]
    paths: ['dist/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create releases for new versions in dist/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for z in dist/MangaFX-plugins-v*.zip; do
            tag=$(basename "$z" .zip); tag=${tag#MangaFX-plugins-}
            if gh release view "$tag" >/dev/null 2>&1; then continue; fi
            gh release create "$tag" "$z" --target "$GITHUB_SHA" --title "$tag" --notes-file "dist/notes-$tag.md"
          done
